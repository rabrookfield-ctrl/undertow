<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undertow — reusable gallery</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101515;color:#e9e9e2;font:14px system-ui,sans-serif}.demo-options{display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;padding:12px 20px;background:#172121}.demo-options strong{font-family:Georgia,serif;font-size:18px;font-weight:400}.demo-options label{display:flex;align-items:center;gap:7px;font-size:13px}.demo-options input{accent-color:#b3cbb8}.demo-options a{color:#c7dfcd;margin-left:auto}#gallery{height:calc(100dvh - 50px);min-height:420px}@media(max-width:640px){.demo-options{min-height:94px;padding:10px 12px;gap:10px 18px}#gallery{height:calc(100dvh - 94px)}}
  </style>
</head>
<body>
  <div class="demo-options" aria-label="Embedding options">
    <strong>Undertow · configurable demo</strong>
    <label><input id="controls" type="checkbox" checked>Show sliders</label>
    <label><input id="add" type="checkbox" checked>Show Add photos</label>
    <a href="examples/published-gallery.html">View a published gallery →</a>
  </div>
  <div id="gallery"></div>
  <script src="src/undertow.js"></script>
  <script>
    const gallery = new Undertow(document.getElementById('gallery'), {
      showControls: true,
      showAddPhotos: true,
      photos: Array.from({length:12}, (_,i) => ({
        src: 'assets/sample-' + (i%5+1) + '.svg',
        name: 'Sample print ' + (i+1),
        alt: 'An abstract landscape illustration'
      }))
    });
    document.getElementById('controls').addEventListener('change',e=>gallery.setOptions({showControls:e.target.checked}));
    document.getElementById('add').addEventListener('change',e=>gallery.setOptions({showAddPhotos:e.target.checked}));
  </script>
</body>
</html>
